[package]
name = "lilcopy"
version = "0.1.0"
edition = "2021"
description = "Copy media thumbnails to clipboard for Discord-friendly meme sharing"
authors = ["Comrade Developer"]

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
]}
image = "0.25"
arboard = "3.4"

[profile.release]
opt-level = "z"
lto = true
strip = true
